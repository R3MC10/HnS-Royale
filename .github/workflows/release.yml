# Release: push a tag vX.Y.Z -> builds the Windows installer and publishes it (plus latest.yml,
# which the installed games' auto-updater reads) to GitHub Releases. Uses the built-in GITHUB_TOKEN.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Build and publish installer
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
