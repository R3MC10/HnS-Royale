# Release: push a tag vX.Y.Z -> builds the Windows installer and publishes it (plus latest.yml,
# which the installed games' auto-updater reads) to GitHub Releases. Uses the built-in GITHUB_TOKEN.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Build installer
        run: npm run dist:win
      # Upload in one step: electron-builder's own parallel uploads raced and dropped the .exe (v0.1.1).
      - name: Publish release
        shell: bash
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "HnS Royale ${GITHUB_REF_NAME#v}"
          --notes "Download the Setup .exe below and run it (SmartScreen: More info, then Run anyway). / Pobierz plik Setup .exe poniżej i uruchom (SmartScreen: Więcej informacji, potem Uruchom mimo to)."
          "release/HnS-Royale-Setup-${GITHUB_REF_NAME#v}.exe"
          "release/HnS-Royale-Setup-${GITHUB_REF_NAME#v}.exe.blockmap"
          release/latest.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
